configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.projectlombok') {
            details.useVersion "1.18.42"
        }
    }
}

ext.generateVersionNumberString = { ->
    StringBuilder stringBuilder = new StringBuilder()
    stringBuilder.append((new Date()).format('21yyMMddHH'))
    return stringBuilder.toString()
}

ext.generateTimestamp = { ->
    StringBuilder stringBuilder = new StringBuilder()
    stringBuilder.append((new Date()).getTime())
    stringBuilder.append("L")
    return stringBuilder.toString()
}

ext.generateRandomUUID = { ->
    StringBuilder stringBuilder = new StringBuilder()
    stringBuilder.append('"' + UUID.randomUUID().toString() + '"')
    return stringBuilder.toString()
}

// Gradle 9 removed Project.exec {}; providers.exec is its replacement and fails on a non-zero exit the same way.
def gitOutput = { String... args ->
    providers.exec {
        commandLine(['git'] + args.toList())
    }.standardOutput.asText.get().trim()
}

ext.generateVersionName = { ->
    StringBuilder stringBuilder = new StringBuilder()
    try {
        String commitObject = gitOutput('describe', '--always')
        try {
            gitOutput('describe', '--tags')
            //stringBuilder.append(stdout.toString().trim())
            //stringBuilder.append("-")
        } catch (ignored) {
            // no tags
        }

        stringBuilder.append(commitObject)
        if (gitOutput('rev-parse', '--show-toplevel').contains("xDrip-Experimental")) {
            stringBuilder.append("-experimental")
        }

        String branch = gitOutput('rev-parse', '--abbrev-ref', 'HEAD')
        if (!branch.equals("master")) {
            stringBuilder.append('-')
            stringBuilder.append(branch)
        }

    } catch (ignored) {
        return "NoGitSystemAvailable"
    }
    stringBuilder.append('-')
    stringBuilder.append((new Date()).format('yyyy.MM.dd'))
    return stringBuilder.toString()
}
