apply plugin: 'com.android.library'
android {
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 26
        multiDexEnabled false
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles rootProject.file('proguard-android-agp8.txt'), 'proguard-rules.txt'
        }
    }
    namespace 'com.twofortyfouram.locale.api'
}

dependencies {
}